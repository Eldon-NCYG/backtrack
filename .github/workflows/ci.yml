name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: make setup
      - name: Lint
        run: make lint
      - name: Unit tests
        run: make test
      # CI never sees real listening data: it builds everything from a fake export
      - name: Build warehouse from a fake export
        run: |
          make fake
          make load
          make build
