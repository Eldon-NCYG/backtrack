[project]
name = "backtrack"
version = "0.1.0"
description = "ELT pipeline over lifetime Spotify listening history"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "dbt-duckdb>=1.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools]
packages = ["ingestion"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
