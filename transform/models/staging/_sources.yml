version: 2

sources:
  - name: raw
    schema: raw
    description: Tables written by the Python loaders in ingestion/. Never edited by dbt.
    tables:
      - name: plays_export
        description: >
          Spotify extended streaming history, one row per play, as exported.
          Rebuilt in full by ingestion/load_export.py. ip_addr is dropped at load time.
        columns:
          - name: ts
            description: When the stream ended, UTC.
            data_tests: [not_null]
          - name: ms_played
            data_tests: [not_null]
